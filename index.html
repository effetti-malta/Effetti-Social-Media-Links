<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Effetti Malta — Find Us Online</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:       #1A2B5E;
      --navy-deep:  #0D1A3A;
      --blue-light: #7BB3D8;
      --coral:      #E8747A;
      --coral-soft: #F2A0A4;
      --white:      #FFFFFF;
      --text-soft:  rgba(255,255,255,0.6);
      --card-bg:    rgba(255,255,255,0.07);
      --card-hover: rgba(255,255,255,0.12);
      --card-border: rgba(123,179,216,0.25);
    }

    body {
      background: var(--navy-deep);
      color: var(--white);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: -150px;
      right: -150px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(26,43,94,0.9) 0%, transparent 70%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: -120px;
      left: -120px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,116,122,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeUp 0.7s ease both;
    }

    .logo-ring {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 2px solid var(--coral);
      overflow: hidden;
      margin: 0 auto 1.25rem;
      box-shadow: 0 0 0 4px rgba(232,116,122,0.15), 0 0 0 8px rgba(232,116,122,0.06);
    }

    .logo-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--white);
      margin-bottom: 6px;
    }

    .brand-sub {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--blue-light);
    }

    .divider {
      width: 36px;
      height: 1px;
      background: var(--coral);
      margin: 1.25rem auto 0;
      opacity: 0.6;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--blue-light);
      margin-bottom: 0.65rem;
      padding-left: 2px;
    }

    .cards-group {
      margin-bottom: 1.5rem;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0.95rem 1.1rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--white);
      margin-bottom: 10px;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }

    .card:last-child { margin-bottom: 0; }

    .card:hover {
      background: var(--card-hover);
      transform: translateY(-2px);
    }

    .card:active { transform: scale(0.99); }

    .card.ig-card:hover { border-color: rgba(232,116,122,0.6); }
    .card.fb-card:hover { border-color: rgba(123,179,216,0.6); }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .ig-card .icon-box {
      background: rgba(232,116,122,0.12);
      border: 1px solid rgba(232,116,122,0.28);
    }

    .fb-card .icon-box {
      background: rgba(123,179,216,0.12);
      border: 1px solid rgba(123,179,216,0.28);
    }

    .icon-box svg { width: 22px; height: 22px; }

    .card-body { flex: 1; }

    .card-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--white);
      margin-bottom: 2px;
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-soft);
    }

    .card-arrow {
      font-size: 20px;
      color: rgba(255,255,255,0.2);
      line-height: 1;
      transition: color 0.2s;
    }

    .ig-card:hover .card-arrow { color: var(--coral-soft); }
    .fb-card:hover .card-arrow { color: var(--blue-light); }

    .ig-group { animation: fadeUp 0.7s ease 0.15s both; }
    .fb-group { animation: fadeUp 0.7s ease 0.28s both; }

    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: rgba(123,179,216,0.45);
      text-transform: uppercase;
      animation: fadeUp 0.7s ease 0.4s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <div class="logo-ring">

      </div>
      <h1 class="brand-name">Effetti Malta</h1>

            <path d="M7 9.5h10M7 12.5h6" stroke="#E8747A" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="card-body">
          <p class="card-title">Send us a message</p>

    </div>

    <div class="cards-group fb-group">
      <p class="section-label">Facebook</p>

      <a class="card fb-card" href="https://www.facebook.com/p/Effetti-Malta-61568374137968/" target="_blank" rel="noopener">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z" stroke="#7BB3D8" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="card-body">
          <p class="card-title">Visit our page</p>
          <p class="card-desc">Browse our page &amp; follow us</p>
        </div>
        <span class="card-arrow">›</span>
      </a>

      <a class="card fb-card" href="https://m.me/61568374137968" target="_blank" rel="noopener">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.477 2 2 6.145 2 11.243c0 2.908 1.438 5.504 3.686 7.21V22l3.371-1.853C10.042 20.37 11.004 20.5 12 20.5c5.523 0 10-4.145 10-9.257C22 6.145 17.523 2 12 2z" stroke="#7BB3D8" stroke-width="1.7"/>
            <path d="M7.5 13l2.5-3 2.5 2.5L16 9" stroke="#7BB3D8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="card-body">
          <p class="card-title">Send us a message</p>
          <p class="card-desc">Message us on Messenger</p>
        </div>
        <span class="card-arrow">›</span>
      </a>
    </div>

    <p class="footer">Reliable, effective, and engineered AV solutions.</p>

  </div>
</body>
</html>
