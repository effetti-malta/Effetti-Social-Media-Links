<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Effetti Malta — Find Us Online</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F9F6F1;
      --ink: #1A1713;
      --ink-soft: #5C5650;
      --gold: #B89A6A;
      --gold-light: #E8DCCB;
      --ig-pink: #C2185B;
      --ig-bg: #FFF0F5;
      --fb-blue: #1565C0;
      --fb-bg: #EEF4FF;
      --card-border: #E2DAD0;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    .header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeUp 0.6s ease both;
    }

    .logo-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      overflow: hidden;
      margin: 0 auto 1.25rem;
    }

    .logo-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .brand-sub {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--gold);
      margin: 1.25rem auto 0;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 0.75rem;
      padding-left: 2px;
      animation: fadeUp 0.6s ease 0.1s both;
    }

    .cards-group {
      margin-bottom: 1.5rem;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 1rem 1.1rem;
      background: #fff;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--ink);
      margin-bottom: 10px;
      transition: border-color 0.2s, transform 0.15s;
    }

    .card:last-child { margin-bottom: 0; }

    .card:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    .card:active { transform: scale(0.99); }

    .card.ig-card:hover { border-color: var(--ig-pink); }
    .card.fb-card:hover { border-color: var(--fb-blue); }

    .icon-box {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .ig-card .icon-box { background: var(--ig-bg); }
    .fb-card .icon-box { background: var(--fb-bg); }

    .icon-box svg { width: 22px; height: 22px; }

    .card-body { flex: 1; }
    .card-title { font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 2px; }
    .card-desc { font-size: 12px; color: var(--ink-soft); }

    .card-arrow {
      font-size: 20px;
      color: var(--card-border);
      line-height: 1;
      transition: color 0.2s;
    }

    .ig-card:hover .card-arrow { color: var(--ig-pink); }
    .fb-card:hover .card-arrow { color: var(--fb-blue); }

    .ig-group { animation: fadeUp 0.6s ease 0.15s both; }
    .fb-group { animation: fadeUp 0.6s ease 0.25s both; }

    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--gold);
      text-transform: uppercase;
      animation: fadeUp 0.6s ease 0.35s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <div class="logo-ring">
        <img src="EFFETTI LOGO WITH BACKGROUND (1).png" alt="Effetti Malta">
      </div>
      <h1 class="brand-name">Effetti Malta</h1>
      <p class="brand-sub">Find us online</p>
      <div class="divider"></div>
    </div>

    <div class="cards-group ig-group">
      <p class="section-label">Instagram</p>

      <a class="card ig-card" href="https://www.instagram.com/effetti.mt" target="_blank" rel="noopener">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="20" height="20" rx="5" stroke="#C2185B" stroke-width="1.7"/>
            <circle cx="12" cy="12" r="4.5" stroke="#C2185B" stroke-width="1.7"/>
            <circle cx="17.5" cy="6.5" r="1.1" fill="#C2185B"/>
          </svg>
        </div>
        <div class="card-body">
          <p class="card-title">Visit our page</p>
          <p class="card-desc">Browse our posts &amp; follow us</p>
        </div>
        <span class="card-arrow">›</span>
      </a>

      <a class="card ig-card" href="https://ig.me/m/effetti.mt" target="_blank" rel="noopener">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="20" height="20" rx="5" stroke="#C2185B" stroke-width="1.7"/>
            <path d="M7 9.5h10M7 12.5h6" stroke="#C2185B" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="card-body">
          <p class="card-title">Send us a message</p>
          <p class="card-desc">Direct message on Instagram</p>
        </div>
        <span class="card-arrow">›</span>
      </a>
    </div>

    <div class="cards-group fb-group">
      <p class="section-label">Facebook</p>

      <a class="card fb-card" href="https://www.facebook.com/p/Effetti-Malta-61568374137968/" target="_blank" rel="noopener">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z" stroke="#1565C0" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="card-body">
          <p class="card-title">Visit our page</p>
          <p class="card-desc">Browse our page &amp; follow us</p>
        </div>
        <span class="card-arrow">›</span>
      </a>

      <a class="card fb-card" href="https://m.me/61568374137968" target="_blank" rel="noopener">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.477 2 2 6.145 2 11.243c0 2.908 1.438 5.504 3.686 7.21V22l3.371-1.853C10.042 20.37 11.004 20.5 12 20.5c5.523 0 10-4.145 10-9.257C22 6.145 17.523 2 12 2z" stroke="#1565C0" stroke-width="1.7"/>
            <path d="M7.5 13l2.5-3 2.5 2.5L16 9" stroke="#1565C0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="card-body">
          <p class="card-title">Send us a message</p>
          <p class="card-desc">Message us on Messenger</p>
        </div>
        <span class="card-arrow">›</span>
      </a>
    </div>

    <p class="footer">Reliable, effective, and engineered AV solutions.</p>

  </div>
</body>
</html>
